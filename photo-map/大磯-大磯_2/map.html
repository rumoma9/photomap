<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@10/dist/ol.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/5.16.0/d3.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/c3/0.7.20/c3.min.css">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  /* 地図はtracklogの有無に関わらず常に450px固定。
     チャートがある場合はその分だけiframe全体(高さ)を広げて確保する
     (mkdocs_export.md.eexのiframe heightと合わせている)。 */
  /* チャートが無い(track無し)場合は地図単体が全体になるので、地図側の
     角を全て丸める。チャートがある場合は上下に積むので、継ぎ目になる
     地図の下側/チャートの上側は角丸にせず、外側の角(地図の上・
     チャートの下)だけ丸める。 */
  #map {
    position: relative;
    width: 100%;
    height: 450px;
    flex: none;
    border-radius: 4px;
    overflow: hidden;
  }
  body.has-chart #map { border-radius: 4px 4px 0 0; }
  #chart {
    display: none;
    width: 100%;
    height: 200px;
    flex: none;
    background-color: #242424;
    border-radius: 0 0 4px 4px;
    overflow: hidden;
  }
  #chart text { fill: #c8c8c2; }
  #chart .c3-axis path,
  #chart .c3-axis line { stroke: #c8c8c2; }
  body.has-chart #chart { display: block; }
  .popup {
    position: absolute;
    display: none;
    background: #fff;
    color: #222;
    border: 1px solid #888;
    border-radius: 4px;
    padding: 8px;
    max-width: 140px;
    transform: translate(-50%, -100%);
    font-family: sans-serif;
    font-size: 13px;
  }
  .popup img { max-width: 120px; max-height: 120px; display: block; margin-bottom: 4px; border-radius: 4px; }
  /* 再生アニメーション中の距離/経過時間/速度は、チャート分の高さを
     増やさずに済むよう地図左下に重ねて表示する
     (mkdocs_export.exのiframe_height計算と二重に合わせずに済む)。 */
  .stroll-hud {
    position: absolute;
    bottom: 0;
    left: 0;
    z-index: 10;
    display: flex;
    gap: 10px;
    background: rgba(255, 255, 255, 0.5);
    color: #222;
    border-radius: 4px;
    padding: 2px 8px;
    font-family: sans-serif;
    line-height: 1.2;
    pointer-events: none;
  }
  /* 値の桁数が変わってもHUD自体の横幅が変動しないよう、
     項目ごとに固定幅にする(表示中に再生ボタンの位置がガタつかないため)。
     ラベル文字列(DISTANCE等)の代わりに絵文字アイコンを使い、アイコン+
     数値+単位を1行にまとめることでラベルを別行にしていた分の高さを
     詰めている。 */
  .stroll-stat {
    display: flex;
    align-items: baseline;
    gap: 3px;
    width: 90px;
    flex: none;
    white-space: nowrap;
  }
  .stroll-icon {
    font-size: 11px;
  }
  .stroll-value {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  /* 数値部分だけを右揃え・固定幅にすることで、桁数が変わっても単位
     ("km"/"hrs"/"km/h")の表示位置がズレないようにする。 */
  .stroll-number {
    display: inline-block;
    min-width: 3.5em;
    text-align: right;
  }
  .stroll-unit {
    display: inline-block;
    margin-left: 0.3em;
  }
  .stroll-marker {
    display: block;
    cursor: pointer;
  }
</style>
</head>

      const remaining = legDuration * (1 - legFraction());
      elmSaru.parentNode.style.transition = remaining > 0 ? `all ${remaining}ms linear` : "";
      overlay.setPosition(legTo);
      tk.resume();
    };

    elmSaru.onclick = () => {
      if (isRunning) return;
      isRunning = true;
      map.un("pointermove", handlePointerMove);
      // クリックした瞬間に開始地点へ寄る(stroll.jsのelmKuma.onclickと同じ
      // 考え方)。この時点のズームをbaseZoomにする(以後ユーザーが手動で
      // ズームを変えればhandleMoveEndがそれを新しいbaseZoomに更新する)。
      map.getView().setCenter(tracks[0].coord);
      map.getView().setZoom(START_ZOOM);
      baseZoom = START_ZOOM;
      // ゴール到達後にリプレイした時、前回終了時点の値(ゴール地点の座標)が
      // 残らないよう区間状態を開始地点にリセットする。
      legFrom = tracks[0].coord;
      legTo = tracks[0].coord;
      legDuration = 0;
      legStartElapsed = 0;
      isNearMarker = false;
      let index = 0;
      let distance = 0;
      let timestamp = 0;
      let currentSpeedText = ["-", ""];

      tk.start((elapsed) => {
        // 距離/速度はadvanceToTrack内(区間が進んだ時)だけ更新し、経過時間
        // だけ毎フレーム更新する(stroll.jsのelmKuma.onclickと同じ考え方。
        // distance/speedを毎フレーム上書きすると区間の途中で表示が
        // リセットされてしまう)。
        setHud(distanceText(distance), elapsedText(elapsed, SPEED), currentSpeedText);
        if (timestamp <= elapsed) {
          if (index < tracks.length) {
            setChartPoint(index);
            const track = tracks[index];
            // track.timestampは<when>由来の実時間(ms)。再生(timestamp
            // アキュムレータ/CSS transition)はtk.elapsed(実時間)と直接
            // 比較するため、SPEED倍だけ圧縮したlegMsを使う。速度表示だけは
            // 圧縮前のtrack.timestampをそのまま渡して実際の歩行速度を出す
            // (ここをtrack.timestampのままにするとSPEED倍遅く進む上、
            // speedTextの分母も引きずられて速度が0近くに丸まっていた)。
            const advanceToTrack = () => {
              const legMs = track.timestamp / SPEED;
              distance += track.distance;
              timestamp += legMs;
              legFrom = legTo;
              legTo = track.coord;
              legDuration = legMs;
              legStartElapsed = elapsed;
              elmSaru.parentNode.style.transition = `all ${legMs}ms linear`;
              overlay.setPosition(track.coord);
              currentSpeedText = speedText(track.distance, track.timestamp);
              setHud(distanceText(distance), elapsedText(elapsed, SPEED), currentSpeedText);
              index++;
            };
            // waypointに近づいたら拡大し、離れたらbaseZoomに戻す
            // (stroll.jsのzoomInMap/NEAR_MARKER_ZOOMと同じ考え方)。今の
            // indexの100m圏内にwaypointがあるかどうかだけで判定する
            // (訪問済みかどうかは見ない。一度圏内→圏外→圏内と出入りしてから
            // 最接近するルートで、既訪問扱いにして最接近時のズームを
            // 取りこぼすことがあったため)。
            const zoomMarkers = zoomInMap.get(index) || [];
            const shouldZoomIn = zoomMarkers.length > 0;
            const zoomChanged = shouldZoomIn !== isNearMarker;
            if (isOutside(track.coord) || zoomChanged) {
              isNearMarker = shouldZoomIn;
              suppressMoveHandlers = true;
              tk.pause();
              elmSaru.parentNode.style.transition = "";
              map.getView().setCenter(track.coord);
              if (zoomChanged) {
                map.getView().setZoom(shouldZoomIn ? NEAR_MARKER_ZOOM : baseZoom);
              }
              const onMoveEnd = () => {
                map.un("moveend", onMoveEnd);
                requestAnimationFrame(() => {
                  requestAnimationFrame(() => {
                    suppressMoveHandlers = false;
                    tk.resume();
                    advanceToTrack();
                  });
                });
              };
              map.on("moveend", onMoveEnd);
            } else {
              advanceToTrack();
            }
          } else {
            elmSaru.parentNode.style.transition = "";
            overlay.setElement(elmGoal);
            elmGoal.onclick = () => {
              setChartPoint(0);
              overlay.setElement(elmSaru);
              overlay.setPosition(tracks[0].coord);
              setHud(distanceText(total_distance), elapsedText(total_time, 1), ["Click to play", ""]);
              map.getView().fit(source.getExtent(), { size: map.getSize(), padding: [40, 40, 40, 40] });
            };
            map.un("movestart", handleMoveStart);
            map.un("moveend", handleMoveEnd);
            map.on("pointermove", handlePointerMove);
            tk.stop();
            isRunning = false;
          }
        }
        // 遠方へのジャンプでカメラをパンしている間はtk.pause()するため、
        // 6時間以上先にジャンプする区間だけはその間の経過時間をスキップする
        // (パン待ちのために実時間で6時間相当も止まらせないため。
        // stroll.jsのelmKuma.onclickと同じ考え方)。
        const hour = ((timestamp - elapsed) * SPEED) / 1000 / 3600;
        return hour >= 6 ? timestamp - elapsed : 0;
      });
      map.on("movestart", handleMoveStart);
      map.on("moveend", handleMoveEnd);
    };

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") tk.resume();
      if (document.visibilityState === "hidden") tk.pause();
    });
  }

  const popup = document.getElementById("popup");
  const popupOverlay = new ol.Overlay({ element: popup, positioning: "bottom-center" });
  map.addOverlay(popupOverlay);

  map.on("click", (evt) => {
    const feature = map.forEachFeatureAtPixel(evt.pixel, (f) => f);
    if (!feature || feature.getGeometry().getType() !== "Point") {
      popup.style.display = "none";
      return;
    }

    const name = feature.get("name") || "";
    const photos = photosByWaypoint[name] || [];
    if (!photos[0]) {
      popup.style.display = "none";
      return;
    }
    popup.innerHTML = '<img src="' + encodeURI(photos[0].image_path) + '">';
    popup.style.display = "block";
    popupOverlay.setPosition(feature.getGeometry().getCoordinates());
  });
</script>
</body>
</html>
