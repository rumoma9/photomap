<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  /* 地図はtracklogの有無に関わらず常に450px固定。
     チャートがある場合はその分だけbodyの高さが伸び、それに合わせて
     iframe自体の高さも下のpostMessage(mkdocs_export.md.eexが受信)で
     自分で広げる。 */
  /* チャートが無い(track無し)場合は地図単体が全体になるので、地図側の
     角を全て丸める。チャートがある場合は上下に積むので、継ぎ目になる
     地図の下側/チャートの上側は角丸にせず、外側の角(地図の上・
     チャートの下)だけ丸める。 */
  #map {
    position: relative;
    width: 100%;
    height: 450px;
    flex: none;
    border-radius: 4px;
    overflow: hidden;
  }
  body.has-chart #map { border-radius: 4px 4px 0 0; }
  #chart {
    display: none;
    width: 100%;
    height: 200px;
    flex: none;
    background-color: #242424;
    border-radius: 0 0 4px 4px;
    overflow: hidden;
  }
  #chart text { fill: #c8c8c2; }
  #chart .c3-axis path,
  #chart .c3-axis line { stroke: #c8c8c2; }
  body.has-chart #chart { display: block; }
  /* 再生アニメーション中の距離/経過時間/速度は、チャート分の高さを
     増やさずに済むよう地図左下に重ねて表示する
     (mkdocs_export.exのiframe_height計算と二重に合わせずに済む)。 */
  .stroll-hud {
    position: absolute;
    bottom: 0;
    left: 0;
    z-index: 10;
    display: flex;
    gap: 10px;
    background: rgba(255, 255, 255, 0.5);
    color: #222;
    border-radius: 4px;
    padding: 2px 8px;
    font-family: sans-serif;
    line-height: 1.2;
    pointer-events: none;
  }
  /* 値の桁数が変わってもHUD自体の横幅が変動しないよう、
     項目ごとに固定幅にする(表示中に再生ボタンの位置がガタつかないため)。
     ラベル文字列(DISTANCE等)の代わりに絵文字アイコンを使い、アイコン+
     数値+単位を1行にまとめることでラベルを別行にしていた分の高さを
     詰めている。 */
  .stroll-stat {
    display: flex;
    align-items: baseline;
    gap: 3px;
    width: 90px;
    flex: none;
    white-space: nowrap;
  }
  .stroll-icon {
    font-size: 11px;
  }
  .stroll-value {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  /* 数値部分だけを右揃え・固定幅にすることで、桁数が変わっても単位
     ("km"/"hrs"/"km/h")の表示位置がズレないようにする。 */
  .stroll-number {
    display: inline-block;
    min-width: 3.5em;
    text-align: right;
  }
  .stroll-unit {
    display: inline-block;
    margin-left: 0.3em;
  }
  .stroll-marker {
    display: block;
    cursor: pointer;
  }
</style>
